# =============================================================================
#  RemoteControl — Nginx Reverse Proxy (Hetzner / Ubuntu)
# =============================================================================
#  Termina o TLS na porta 443 e encaminha o tráfego WebSocket seguro (wss://)
#  para o processo `server.go` (relay) que escuta localmente.
#
#  Instalação:
#     sudo cp remotecontrol.conf /etc/nginx/sites-available/remotecontrol.conf
#     sudo ln -s /etc/nginx/sites-available/remotecontrol.conf \
#                /etc/nginx/sites-enabled/remotecontrol.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
#  Certificado TLS (recomendado: Let's Encrypt / certbot):
#     sudo apt install certbot python3-certbot-nginx
#     sudo certbot --nginx -d relay.exemplo.com
# =============================================================================

# ---------------------------------------------------------------------------
# Upstream: onde o server.go (relay) está à escuta localmente.
# Ajuste a porta para corresponder à flag -listen do seu servidor.
# ---------------------------------------------------------------------------
upstream remotecontrol_relay {
    server 127.0.0.1:8080;

    # Mantém ligações keep-alive abertas para o upstream, reduzindo a
    # sobrecarga de handshake em reconexões frequentes.
    keepalive 64;
}

# ---------------------------------------------------------------------------
# Mapa auxiliar: garante o header "Connection" correto consoante exista
# (ou não) um pedido de Upgrade. Essencial para WebSockets atrás de proxy.
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Redireciona todo o tráfego HTTP (porta 80) para HTTPS (porta 443).
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name relay.exemplo.com;

    # Permite que o certbot resolva o desafio ACME em HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Servidor HTTPS principal — termina o TLS e faz proxy para o relay.
# ---------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name relay.exemplo.com;

    # -- Certificados TLS -----------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/relay.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.exemplo.com/privkey.pem;

    # -- Boas práticas TLS ----------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — força HTTPS no browser durante 1 ano.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Limite de tamanho de corpo (ajuste se transferir ficheiros grandes).
    client_max_body_size 50m;

    # Logs dedicados facilitam o diagnóstico de quedas de ligação.
    access_log /var/log/nginx/remotecontrol.access.log;
    error_log  /var/log/nginx/remotecontrol.error.log;

    # -----------------------------------------------------------------------
    #  Endpoint WebSocket (wss://relay.exemplo.com/ws)
    #  Ajuste o path "/ws" para corresponder à rota do seu server.go.
    # -----------------------------------------------------------------------
    location /ws {
        proxy_pass http://remotecontrol_relay;

        # --- Handshake de Upgrade para WebSocket ---------------------------
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # --- Preservar informação do cliente original ---------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Timeouts longos -----------------------------------------------
        # Sessões de controlo remoto podem ficar inativas (sem frames) durante
        # longos períodos. Estes valores evitam que o Nginx feche a ligação.
        proxy_connect_timeout 10s;      # tempo para estabelecer ligação ao relay
        proxy_send_timeout    3600s;    # 1h sem conseguir enviar para o relay
        proxy_read_timeout    3600s;    # 1h sem receber dados do relay

        # Desativa o buffering — streaming em tempo real precisa de latência baixa.
        proxy_buffering off;

        # Nota: recomenda-se também um mecanismo de ping/pong ao nível
        # da aplicação (no server.go) para manter a ligação viva de forma
        # mais robusta do que depender apenas destes timeouts.
    }

    # -----------------------------------------------------------------------
    #  Endpoint de saúde / estado (opcional)
    # -----------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://remotecontrol_relay;
        proxy_set_header Host $host;
        access_log off;
    }

    # -----------------------------------------------------------------------
    #  Restante tráfego HTTP normal para o relay (API, página de estado, etc.)
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://remotecontrol_relay;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
